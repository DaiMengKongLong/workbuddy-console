  <rect x="944" y="384" width="176" height="50" rx="25" fill="rgba(255,255,255,0.07)" stroke="rgba(165,180,252,0.28)" stroke-width="1.5"/><circle cx="970" cy="409" r="12" fill="#6366f1"/><text x="970" y="415" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" font-weight="700"
